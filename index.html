<!doctype html>
<html lang="en" data-theme="light" data-view="comfortable">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Follow List Manager</title>
<meta name="description" content="A local, private dashboard for working through an exported list of social-media profiles one by one.">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="skip-link" href="#listViewport">Skip to account list</a>

<div class="app-shell">

  <header class="app-header">
    <div class="app-header__title">
      <h1>Follow List Manager</h1>
      <p class="app-header__tagline">Work through your imported follow list, one profile at a time.</p>
    </div>
    <div class="app-header__actions">
      <button id="btnAbout" class="btn btn--ghost" type="button">Privacy &amp; about</button>
      <button id="btnViewToggle" class="btn btn--icon" type="button" aria-pressed="false" title="Switch to compact view">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
        <span class="visually-hidden">Toggle compact view</span>
      </button>
      <button id="btnTheme" class="btn btn--icon" type="button" aria-pressed="false" title="Switch to dark theme">
        <svg id="iconThemeSun" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 1.5v2M10 16.5v2M18.5 10h-2M3.5 10h-2M15.7 4.3l-1.4 1.4M5.7 14.3l-1.4 1.4M15.7 15.7l-1.4-1.4M5.7 5.7 4.3 4.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <svg id="iconThemeMoon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false" hidden><path d="M17 12.4A7.5 7.5 0 0 1 7.6 3a7.5 7.5 0 1 0 9.4 9.4Z" fill="currentColor"/></svg>
        <span class="visually-hidden">Toggle dark theme</span>
      </button>
    </div>
  </header>

  <section class="toolbar-primary" aria-label="Import and backup">
    <div class="toolbar-primary__group">
      <button id="btnImportHtml" class="btn btn--primary" type="button">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" focusable="false"><path d="M10 3v9m0 0 3.5-3.5M10 12 6.5 8.5M4 15.5h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        Import files / following list
      </button>
      <input id="fileImportHtml" type="file" accept=".html,.htm,.txt,.csv,.tsv,.md,.markdown,.rtf,.xml,.json,.doc,.docx,.odt,.pdf,.xlsx,.xlsm,.pptx,.epub,text/*,application/*" multiple hidden>
      <button id="btnOpenNext" class="btn btn--accent" type="button" title="Open the next not-followed profile">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" focusable="false"><path d="M7 4l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        Open next profile
      </button>
    </div>
    <div class="toolbar-primary__group">
      <button id="btnExport" class="btn btn--secondary" type="button">Export backup</button>
      <button id="btnImportBackup" class="btn btn--secondary" type="button">Restore backup</button>
      <input id="fileImportBackup" type="file" accept=".json,application/json" hidden>
      <button id="btnReset" class="btn btn--danger-ghost" type="button">Reset all data</button>
    </div>
  </section>

  <p class="privacy-note">
    <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true" focusable="false"><path d="M10 2 4 4.5v4.6c0 4 2.6 6.9 6 8 3.4-1.1 6-4 6-8V4.5L10 2Z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    Everything stays on this device — nothing you import is uploaded anywhere. <button id="btnAboutInline" class="link-button" type="button">Learn more</button>
  </p>

  <section class="stats-strip" aria-label="Progress statistics">
    <div class="stat-block">
      <span class="stat-block__value" id="statTotal">0</span>
      <span class="stat-block__label">Total</span>
    </div>
    <div class="stat-block" data-status="not-followed">
      <span class="stat-block__value" id="statNotFollowed">0</span>
      <span class="stat-block__label">Not followed</span>
    </div>
    <div class="stat-block" data-status="followed">
      <span class="stat-block__value" id="statFollowed">0</span>
      <span class="stat-block__label">Followed</span>
    </div>
    <div class="stat-block" data-status="skipped">
      <span class="stat-block__value" id="statSkipped">0</span>
      <span class="stat-block__label">Skipped</span>
    </div>
    <div class="stat-progress">
      <div class="stat-progress__track" role="progressbar" aria-label="Followed progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressBar">
        <div class="stat-progress__fill" id="progressBarFill"></div>
      </div>
      <span class="stat-progress__pct" id="progressPct">0%</span>
    </div>
  </section>

  <section class="toolbar-secondary" aria-label="Filter, search and sort">
    <div class="filter-tabs" role="tablist" aria-label="Filter by status" id="filterTabs">
      <button role="tab" class="filter-tab is-active" data-filter="all" aria-selected="true" type="button">All <span class="filter-tab__count" id="countAll">0</span></button>
      <button role="tab" class="filter-tab" data-filter="not-followed" aria-selected="false" type="button">Not followed <span class="filter-tab__count" id="countNotFollowed">0</span></button>
      <button role="tab" class="filter-tab" data-filter="followed" aria-selected="false" type="button">Followed <span class="filter-tab__count" id="countFollowed">0</span></button>
      <button role="tab" class="filter-tab" data-filter="skipped" aria-selected="false" type="button">Skipped <span class="filter-tab__count" id="countSkipped">0</span></button>
    </div>
    <div class="search-sort">
      <div class="search-field">
        <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true" focusable="false"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m17 17-4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input type="search" id="searchInput" placeholder="Search name or link…" aria-label="Search accounts by name or link">
        <kbd class="search-field__hint">/</kbd>
      </div>
      <label class="sort-field">
        <span>Sort</span>
        <select id="sortSelect" aria-label="Sort accounts">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="name-asc">Name A–Z</option>
          <option value="name-desc">Name Z–A</option>
          <option value="updated">Recently updated</option>
        </select>
      </label>
    </div>
  </section>

  <section class="bulk-bar" id="bulkBar" hidden aria-label="Bulk actions">
    <span id="bulkCount">0 selected</span>
    <div class="bulk-bar__actions">
      <button data-bulk="followed" class="btn btn--small" type="button">Mark followed</button>
      <button data-bulk="skipped" class="btn btn--small" type="button">Mark skipped</button>
      <button data-bulk="not-followed" class="btn btn--small" type="button">Mark not followed</button>
      <button id="btnClearSelection" class="btn btn--small btn--ghost" type="button">Clear selection</button>
    </div>
  </section>

  <section class="list-header">
    <label class="list-header__select-all">
      <input type="checkbox" id="selectAllVisible" aria-label="Select all visible accounts">
      <span>Select all visible</span>
    </label>
    <span class="list-header__hint" id="listHeaderHint" aria-live="polite"></span>
  </section>

  <main class="list-viewport" id="listViewport">
    <div class="list-sizer" id="listSizer">
      <div class="list-rows" id="listRows" role="list" aria-label="Imported accounts"></div>
    </div>
    <div class="empty-state" id="emptyState" hidden>
      <svg viewBox="0 0 64 64" width="52" height="52" aria-hidden="true" focusable="false"><path d="M14 20h36M14 32h36M14 44h20" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      <p id="emptyStateText">No accounts imported yet.</p>
      <button id="emptyStateAction" class="btn btn--primary" type="button" hidden>Import files / following list</button>
    </div>
  </main>

  <nav class="pagination" id="pagination" aria-label="Account pages" hidden>
    <button id="btnPrevPage" class="btn btn--secondary" type="button">Previous Page</button>
    <span id="pageInfo" class="pagination__info" aria-live="polite">Page 1 of 1</span>
    <button id="btnNextPage" class="btn btn--secondary" type="button">Next Page</button>
  </nav>

  <p class="list-footnote" id="listFootnote"></p>

</div>


<div class="import-progress" id="importProgress" hidden role="status" aria-live="polite">
  <div class="spinner" aria-hidden="true"></div>
  <span id="importProgressText">Importing…</span>
</div>

<div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="false"></div>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="modal" tabindex="-1">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div class="modal__actions" id="modalActions"></div>
  </div>
</div>

<template id="rowTemplate">
  <div class="account-row" role="listitem">
    <label class="account-row__select">
      <input type="checkbox" class="account-row__checkbox">
      <span class="visually-hidden">Select account</span>
    </label>
    <div class="account-row__main">
      <p class="account-row__name"></p>
      <p class="account-row__url"></p>
    </div>
    <span class="account-row__badge"></span>
    <div class="account-row__actions"></div>
  </div>
</template>

<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/importer.js"></script>
<script src="js/toast.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
